<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>发布文章 | Xian的笔记</title>
  <link rel="stylesheet" href="layui/css/layui.css">
  <link rel="stylesheet" href="static/css/mian.css">
  <link rel="stylesheet" href="static/css/blog-v2.css">
</head>
<body class="lay-blog blog-v2">
  <div class="header">
    <div class="header-wrap">
      <h1 class="logo pull-left"><a href="index.html"><img src="static/images/logo2.png" alt="Xian"><span>Xian的笔记</span></a></h1>
    </div>
  </div>
  <div class="container-wrap">
    <main class="site-main publish-shell">
      <header class="page-heading">
        <p class="eyebrow">PRIVATE WRITER</p>
        <h1>发布文章</h1>
      </header>
      <p class="publish-notice" id="publish-notice" role="status"></p>

      <section class="publish-panel" id="publish-login">
        <form id="publish-login-form" class="publish-form">
          <label>发布密码<input name="password" type="password" autocomplete="current-password" required></label>
          <button class="publish-primary" type="submit" data-label="进入编辑器">进入编辑器</button>
        </form>
      </section>

      <section class="publish-panel" id="publish-editor" hidden>
        <div class="publish-mode" role="group" aria-label="文章操作模式">
          <button id="publish-mode-create" class="is-active" type="button">新建文章</button>
          <button id="publish-mode-edit" type="button">修改或删除</button>
        </div>

        <section class="publish-picker" id="publish-picker" hidden>
          <label>已发布文章
            <select id="publish-article-select" aria-label="选择要修改的文章"></select>
          </label>
          <button id="publish-load-article" type="button">载入文章</button>
        </section>

        <form id="publish-article-form" class="publish-form">
          <p class="publish-editing" id="publish-editing" hidden></p>
          <div class="publish-grid">
            <label>标题<input name="title" maxlength="80" required></label>
            <label>英文短标题<input name="slug" pattern="[a-z0-9]+(-[a-z0-9]+)*" placeholder="mysql-online-index" required></label>
          </div>
          <label>摘要<textarea name="description" rows="3" maxlength="180" required></textarea></label>
          <div class="publish-grid publish-grid-meta">
            <label>分类<input name="category" maxlength="30" placeholder="Java 后端" required></label>
            <label>标签<input name="tags" maxlength="180" placeholder="MySQL, 索引, 运维" required></label>
            <label>发布日期<input name="date" type="date" required></label>
          </div>
          <label>正文<textarea name="content" rows="22" placeholder="从正文开始写，不需要 Front Matter。" required></textarea></label>
          <section class="asset-library" aria-labelledby="asset-library-title">
            <div class="asset-library-heading">
              <h2 id="asset-library-title">素材</h2>
              <p>上传后可搜索文件名并复制公开链接，正文不会自动修改。</p>
            </div>
            <div class="asset-upload-controls">
              <label class="asset-file-picker">选择文件
                <input id="asset-files" type="file" accept=".png,.jpg,.jpeg,.webp,.pdf,image/png,image/jpeg,image/webp,application/pdf" multiple>
              </label>
              <button id="asset-upload" type="button">上传所选文件</button>
            </div>
            <div class="asset-search-controls">
              <label>搜索已上传文件
                <input id="asset-keyword" type="search" maxlength="60" placeholder="输入文件名关键词">
              </label>
              <button id="asset-search" type="button">搜索文件</button>
            </div>
            <p class="asset-notice" id="asset-notice" role="status"></p>
            <ul class="asset-list" id="asset-list" aria-live="polite"></ul>
          </section>
          <div class="publish-actions">
            <button id="save-draft" type="button">保存草稿</button>
            <button class="publish-primary" id="publish-submit" type="submit" data-label="发布文章">发布文章</button>
            <button id="publish-delete" type="button" class="publish-danger" hidden>删除文章</button>
            <button id="publish-logout" type="button" class="publish-quiet">退出</button>
          </div>
        </form>
      </section>
    </main>
  </div>
  <footer class="footer"><p><span>&copy; 2026</span><span>Xian的笔记</span></p></footer>
  <script src="static/js/article-index.js"></script>
  <script src="static/js/publish-config.js"></script>
  <script src="static/js/publish.js"></script>
</body>
</html>
